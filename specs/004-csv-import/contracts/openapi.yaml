openapi: 3.1.0
info:
  title: HL Budget API — feature 004 additions
  version: "1"
  description: |
    Additions to the v1 contract published by features 001–003. Everything here is backward
    compatible (Principle VII): one new resource with two operations and three new schemas.
    Nothing existing changes.

    Shared components not repeated here (Money, MoneyTotal, Problem, the common error responses
    Unauthenticated, NotFound, InternalError, ServiceUnavailable, BadRequest, the X-Request-Id
    and Location headers, bearerAuth) are those of hl-budget-backend's contracts/api.yaml. The
    backend's generated contracts/api.yaml is the source the frontend builds from.
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  /api/v1/spending-imports:
    post:
      operationId: createSpendingImport
      tags: [Spending imports]
      summary: Record many spendings at once, all or nothing
      description: |
        Creates every row as a spending in one step (research R-006). If any row is invalid,
        nothing is created and every problem is listed, with a JSON Pointer naming the row
        (`#/spendings/3/date`).

        Categories and accounts are given by name. Each name is matched against the caller's
        items ignoring case and surrounding spaces, and created when none matches. A name that
        appears in several rows, in any letter case, creates one item.

        Send an `Idempotency-Key` to make retries safe: repeating an import with the same key and
        the same rows returns the first import with 200 and `Idempotent-Replayed: true` instead of
        creating the spendings again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Any string up to 255 characters; a UUID is recommended
          schema: { type: string, maxLength: 255 }
          example: 6a1d9c2e-8f4b-4b7a-9e3c-1f2d3c4b5a69
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpendingImportRequest" }
            examples:
              twoRows:
                value:
                  spendings:
                    - date: "2026-10-28"
                      merchant: Corner Bakery
                      amount: { amount: "12.40", currency: CAD }
                      categoryName: Groceries
                      accountName: Visa
                    - date: "2026-09-30"
                      merchant: "Lakeshore Fuel, Hwy 7"
                      amount: { amount: "61.20", currency: CAD }
                      categoryName: car
                      accountName: Amex
      responses:
        "201":
          description: Created; every row is now a spending
          headers:
            Location:
              description: The new import, e.g. /api/v1/spending-imports/{id}
              schema: { type: string, format: uri-reference }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendingImport" }
              examples:
                created: { $ref: "#/components/examples/SpendingImport" }
        "200":
          description: A replay of an earlier import with the same Idempotency-Key and rows; nothing new was created
          headers:
            Location:
              description: The earlier import
              schema: { type: string, format: uri-reference }
            Idempotent-Replayed:
              description: Always `true` on a replay
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendingImport" }
              examples:
                replayed: { $ref: "#/components/examples/SpendingImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/SpendingImportValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/spending-imports/{importId}:
    get:
      operationId: getSpendingImport
      tags: [Spending imports]
      summary: One of the caller's imports
      description: |
        The summary recorded when the import was created. It does not change when the imported
        spendings are later edited or deleted. Another user's import is 404, like an unknown id.
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 9b2f6e1a-4c3d-4e5f-8a7b-0c1d2e3f4a5b
      responses:
        "200":
          description: The import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendingImport" }
              examples:
                found: { $ref: "#/components/examples/SpendingImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  schemas:
    SpendingImportRequest:
      type: object
      description: The rows to import, in the order the user reviewed them
      properties:
        spendings:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/SpendingImportRow" }
      required: [spendings]

    SpendingImportRow:
      type: object
      description: One spending. The same rules as SpendingRequest, with category and account by name
      properties:
        date:
          type: string
          format: date
          description: Today or earlier, in the app's time zone
          example: "2026-10-28"
        merchant:
          type: string
          minLength: 1
          maxLength: 255
          example: Corner Bakery
        amount: { $ref: "#/components/schemas/Money" }
        categoryName:
          type: string
          minLength: 1
          maxLength: 50
          description: Matched against the caller's categories ignoring case and surrounding spaces; created when none matches
          example: Groceries
        accountName:
          type: string
          minLength: 1
          maxLength: 50
          description: Matched against the caller's accounts ignoring case and surrounding spaces; created when none matches
          example: Visa
      required: [date, merchant, amount, categoryName, accountName]

    SpendingImport:
      type: object
      description: The receipt of a completed import. Holds nothing from the imported file
      properties:
        id: { type: string, format: uuid }
        spendingCount:
          type: integer
          minimum: 1
          maximum: 1000
          description: How many spendings were created
        firstDate:
          type: string
          format: date
          description: The earliest spending date in the import
        lastDate:
          type: string
          format: date
          description: The latest spending date in the import; clients show this month afterwards
        total: { $ref: "#/components/schemas/MoneyTotal" }
        createdAt:
          type: string
          format: date-time
      required: [id, spendingCount, firstDate, lastDate, total, createdAt]

  responses:
    SpendingImportValidationFailed:
      description: |
        Nothing was created. Every invalid field of every row is listed in `errors`, its pointer
        naming the row by its 0-based position (`#/spendings/3/amount/amount`). Codes are those
        of SpendingRequest (Required, TypeMismatch, NotBlank, Size, Pattern, Positive,
        UnsupportedCurrency, NotFuture), plus Size on `#/spendings` for 0 or more than 1000 rows.
        `details.reason = idempotency-key-reused` when the Idempotency-Key was already used for
        different rows.
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidRows:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: "2 fields are invalid: spendings[1].date, spendings[4].amount.amount"
                instance: /api/v1/spending-imports
                timestamp: 2026-10-29T14:03:11Z
                traceId: 4be0baf6ee174255
                errors:
                  - pointer: "#/spendings/1/date"
                    field: spendings[1].date
                    code: NotFuture
                    message: must be today or earlier
                  - pointer: "#/spendings/4/amount/amount"
                    field: spendings[4].amount.amount
                    code: Positive
                    message: must be greater than 0
            tooMany:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: "1 field is invalid: spendings"
                instance: /api/v1/spending-imports
                timestamp: 2026-10-29T14:03:11Z
                traceId: 4be0baf6ee174255
                errors:
                  - pointer: "#/spendings"
                    field: spendings
                    code: Size
                    message: must have 1 to 1000 rows
            keyReused:
              value:
                type: urn:problem:hl-budget:unprocessable-entity
                title: Unprocessable Content
                status: 422
                detail: The Idempotency-Key was already used for a different import
                instance: /api/v1/spending-imports
                timestamp: 2026-10-29T14:03:11Z
                traceId: 4be0baf6ee174255
                details:
                  reason: idempotency-key-reused

  examples:
    SpendingImport:
      value:
        id: 9b2f6e1a-4c3d-4e5f-8a7b-0c1d2e3f4a5b
        spendingCount: 2
        firstDate: "2026-09-30"
        lastDate: "2026-10-28"
        total: { amount: "73.60", currency: CAD }
        createdAt: "2026-10-29T14:03:11Z"
