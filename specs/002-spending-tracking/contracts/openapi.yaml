# Design contract for feature 002 (additions to /api/v1; nothing from 001 changes shape).
# The authoritative document is generated by the backend (OpenApiExportIT → contracts/api.yaml)
# and MUST match this one. Shared components (Problem, FieldViolation, X-Request-Id,
# Unauthenticated, InternalError, ServiceUnavailable) are 001's and are referenced, not redefined.
openapi: 3.1.0
info:
  title: HL Budget API — feature 002 additions
  version: v1
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Accounts
    description: Where the caller's money was paid from
  - name: Categories
    description: What the caller's money was spent on, including the 17 defaults
  - name: Spendings
    description: The caller's spending transactions

paths:
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List all of the caller's accounts, sorted by name, with spending counts
      responses:
        "200":
          description: All accounts (never paged; personal scale)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountList" }
              example:
                items:
                  - { id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11, name: Amex, spendingCount: 2 }
                  - { id: 9b2e7c41-6a3f-4d58-8e1b-5c7a0f9d3b22, name: Cash, spendingCount: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Amex }
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
              example: { id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11, name: Amex, spendingCount: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/DuplicateName" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Fetch one account
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [Accounts]
      operationId: renameAccount
      summary: Rename an account (full replacement of its only field)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Amex Gold }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DuplicateNameOrConcurrent" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account that no spending uses
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List all of the caller's categories, sorted by name, with spending counts
      description: >-
        On the caller's first budgeting call the 17 default categories are created for them
        (exactly once), so this never returns an empty list.
      responses:
        "200":
          description: All categories (never paged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryList" }
              example:
                items:
                  - { id: 0a6d2f1e-8c3b-4b9a-a7e2-1f5c9d0b4e33, name: Beauty, isDefault: true, spendingCount: 0 }
                  - { id: 7e4b1c9a-3d2f-4a6e-b8c1-2d9f0e5a6b44, name: Coffee, isDefault: false, spendingCount: 5 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a custom category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Coffee }
      responses:
        "201":
          description: Created (isDefault is always false)
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/DuplicateName" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/categories/{categoryId}:
    parameters:
      - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Fetch one category
      responses:
        "200":
          description: The category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [Categories]
      operationId: renameCategory
      summary: Rename a custom category (defaults are refused with 422)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameRequest" }
            example: { name: Cafés }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DuplicateNameOrConcurrent" }
        "422": { $ref: "#/components/responses/ValidationOrDefaultCategory" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete a custom category that no spending uses (defaults are refused with 422)
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InUse" }
        "422": { $ref: "#/components/responses/DefaultCategory" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/spendings:
    get:
      tags: [Spendings]
      operationId: listSpendings
      summary: List the caller's spendings, paged, filtered and sorted
      parameters:
        - { name: from, in: query, description: "Earliest date, inclusive", schema: { type: string, format: date }, example: "2026-10-01" }
        - { name: to, in: query, description: "Latest date, inclusive; must not be before `from`", schema: { type: string, format: date }, example: "2026-10-31" }
        - name: categoryId
          in: query
          description: Repeatable; matches any of the given categories
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid } }
        - name: accountId
          in: query
          description: Repeatable; matches any of the given accounts
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid } }
        - { name: page, in: query, description: "0-based", schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          description: Ties are broken by creation time in the same direction, then id
          schema:
            type: string
            enum: ["date,desc", "date,asc", "amount,desc", "amount,asc"]
            default: "date,desc"
      responses:
        "200":
          description: One page (empty `items` when nothing matches)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpendingPage" }
              example:
                items:
                  - id: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
                    date: "2026-10-20"
                    merchant: Loblaws
                    amount: { amount: "84.37", currency: CAD }
                    category: { id: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55, name: Groceries }
                    account: { id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11, name: Amex }
                    createdAt: "2026-10-27T14:03:11Z"
                    updatedAt: "2026-10-27T14:03:11Z"
                page: 0
                size: 20
                totalItems: 1
                totalPages: 1
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      tags: [Spendings]
      operationId: createSpending
      summary: Record a spending
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            1–255 visible ASCII characters. Repeating a create with the same key and the same body
            returns the first spending with 200 and `Idempotent-Replayed: true`; the same key with
            a different body is refused with 422 `idempotency-key-reused`.
          schema: { type: string, minLength: 1, maxLength: 255 }
          example: 5d1f0c2e-retry-safe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpendingRequest" }
            example:
              date: "2026-10-20"
              merchant: Loblaws
              amount: { amount: "84.37", currency: CAD }
              categoryId: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55
              accountId: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11
      responses:
        "201":
          description: Created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spending" }
              examples:
                created: { $ref: "#/components/examples/SpendingLoblaws" }
        "200":
          description: Replay of an earlier create with the same Idempotency-Key and body
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed:
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/SpendingValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/spendings/{spendingId}:
    parameters:
      - { name: spendingId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Spendings]
      operationId: getSpending
      summary: Fetch one spending
      responses:
        "200":
          description: The spending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spending" }
              examples:
                found: { $ref: "#/components/examples/SpendingLoblaws" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [Spendings]
      operationId: updateSpending
      summary: Replace all details of a spending
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpendingRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Spending" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConcurrentModification" }
        "422": { $ref: "#/components/responses/SpendingValidationFailed" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Spendings]
      operationId: deleteSpending
      summary: Delete a spending permanently
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  headers:
    Location:
      description: Address of the resource
      schema: { type: string, example: /api/v1/spendings/8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66 }

  schemas:
    NameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Trimmed; unique per user ignoring case
    Account:
      type: object
      required: [id, name, spendingCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        spendingCount: { type: integer, format: int64, minimum: 0, readOnly: true }
    AccountList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Account" } }
    Category:
      type: object
      required: [id, name, isDefault, spendingCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 50 }
        isDefault: { type: boolean, readOnly: true, description: "Default categories cannot be renamed or deleted" }
        spendingCount: { type: integer, format: int64, minimum: 0, readOnly: true }
    CategoryList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Category" } }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d{1,8}(\.\d{1,2})?$'
          description: Exact decimal as a string; greater than 0. Responses always carry 2 decimals
          example: "84.37"
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217. Must equal the app's configured currency
          example: CAD
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    SpendingRequest:
      type: object
      required: [date, merchant, amount, categoryId, accountId]
      properties:
        date: { type: string, format: date, description: "Today or earlier, in the app's time zone" }
        merchant: { type: string, minLength: 1, maxLength: 255 }
        amount: { $ref: "#/components/schemas/Money" }
        categoryId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
    Spending:
      type: object
      required: [id, date, merchant, amount, category, account, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        merchant: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        category: { $ref: "#/components/schemas/Ref" }
        account: { $ref: "#/components/schemas/Ref" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SpendingPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Spending" } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }

  examples:
    SpendingLoblaws:
      value:
        id: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66
        date: "2026-10-20"
        merchant: Loblaws
        amount: { amount: "84.37", currency: CAD }
        category: { id: 2c8e4f6a-1b3d-4e5f-9a7b-8c0d1e2f3a55, name: Groceries }
        account: { id: 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11, name: Amex }
        createdAt: "2026-10-27T14:03:11Z"
        updatedAt: "2026-10-27T14:03:11Z"

  # Problem bodies use 001's Problem schema; `type` is urn:problem:hl-budget:<category>.
  responses:
    BadRequest:
      description: The request cannot be read (body is not JSON, or a path id is not a UUID)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:bad-request
            title: Bad Request
            status: 400
            detail: The path segment spendingId must be a valid UUID.
            traceId: 4be0baf6ee174255
    NotFound:
      description: No such resource for the caller (also returned for another user's resource)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:not-found
            title: Not Found
            status: 404
            detail: Spending 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66 was not found
            traceId: 4be0baf6ee174255
            details: { resource: spending, spendingId: 8d3a6b1f-4c2e-4f7a-9b0d-1e2c3a4b5c66 }
    DuplicateName:
      description: Another account/category of the caller already has this name (ignoring case)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:conflict
            title: Conflict
            status: 409
            detail: An account named "amex" already exists
            traceId: 4be0baf6ee174255
            details: { reason: duplicate-name, name: amex }
    DuplicateNameOrConcurrent:
      description: "`details.reason` is `duplicate-name` or `concurrent-modification`"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            duplicateName:
              value: { type: urn:problem:hl-budget:conflict, title: Conflict, status: 409, detail: An account named "amex" already exists, traceId: 4be0baf6ee174255, details: { reason: duplicate-name, name: amex } }
            concurrent:
              value: { type: urn:problem:hl-budget:conflict, title: Conflict, status: 409, detail: The resource was modified concurrently. Re-read it and retry., traceId: 4be0baf6ee174255, details: { reason: concurrent-modification } }
    ConcurrentModification:
      description: Lost a concurrent write; re-read and retry
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example: { type: urn:problem:hl-budget:conflict, title: Conflict, status: 409, detail: The resource was modified concurrently. Re-read it and retry., traceId: 4be0baf6ee174255, details: { reason: concurrent-modification } }
    InUse:
      description: Spendings still use this account/category; move or delete them first
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:conflict
            title: Conflict
            status: 409
            detail: Account 3f1c5a8e-2b7d-4e0a-9c61-0d2f4b8a7e11 is used by 2 spendings
            traceId: 4be0baf6ee174255
            details: { reason: in-use, spendingCount: 2 }
    DefaultCategory:
      description: Default categories cannot be renamed or deleted
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:unprocessable-entity
            title: Unprocessable Entity
            status: 422
            detail: Groceries is a default category and cannot be changed
            traceId: 4be0baf6ee174255
            details: { reason: default-category }
    ValidationFailed:
      description: One or more fields or parameters are invalid; each is listed in `errors`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:unprocessable-entity
            title: Unprocessable Entity
            status: 422
            detail: "1 field is invalid: name"
            traceId: 4be0baf6ee174255
            errors:
              - { pointer: "#/name", field: name, code: NotBlank, message: must not be blank }
    ValidationOrDefaultCategory:
      description: Invalid field (`errors`) or the category is a default (`details.reason = default-category`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalid:
              value: { type: urn:problem:hl-budget:unprocessable-entity, title: Unprocessable Entity, status: 422, detail: "1 field is invalid: name", traceId: 4be0baf6ee174255, errors: [{ pointer: "#/name", field: name, code: NotBlank, message: must not be blank }] }
            defaultCategory:
              value: { type: urn:problem:hl-budget:unprocessable-entity, title: Unprocessable Entity, status: 422, detail: Groceries is a default category and cannot be changed, traceId: 4be0baf6ee174255, details: { reason: default-category } }
    SpendingValidationFailed:
      description: >-
        Invalid fields (`errors`; codes include Required, TypeMismatch, NotBlank, Size, Pattern,
        Positive, UnsupportedCurrency, NotFuture, NotFound) or, on create only, an Idempotency-Key
        reused with a different body (`details.reason = idempotency-key-reused`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalid:
              value:
