# Design-time contract for hl-budget-backend v1 (feature 001-platform-foundation).
# The published source of truth is generated by the backend (springdoc) and committed as
# hl-budget-backend/contracts/api.yaml by OpenApiExportIT; the frontend generates its types from that
# file. This document is the target the implementation must match.
openapi: 3.1.0
info:
  title: HL Budget API
  version: 1.0.0
  description: |
    Backend for HL Budget. Every business endpoint is versioned under `/api/v{N}` and requires an
    Auth0 access token for the HL Budget API audience. Every error is RFC 9457
    `application/problem+json` with a stable `type` URN and a `traceId`.
servers:
  - url: /
    description: Same host as the web app; the backend serves everything under /api
security:
  - bearerAuth: []
tags:
  - name: Users
    description: The signed-in user's own record
  - name: Operations
    description: Unversioned probes for the platform (not routed through the ingress)

paths:
  /api/v1/users/me:
    put:
      tags: [Users]
      operationId: ensureMyProfile
      summary: Create or refresh the caller's user record and return it
      description: |
        Identifies the caller only from the validated access token (`sub`). On the first call
        for a `sub`, creates the user record and returns 201 with a `Location` header. On later
        calls, sets `lastSeenAt` to now, refreshes `displayName`, `email` and `avatarUrl` from the
        token's claims, and returns 200. Idempotent: concurrent first calls yield exactly one
        record. Takes no request body and no user identifier.
      responses:
        "200":
          description: Existing record refreshed
          headers:
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
              examples:
                returning: { $ref: "#/components/examples/ProfileReturning" }
        "201":
          description: Record created on first call
          headers:
            Location:
              description: Address of the created resource
              schema: { type: string, example: /api/v1/users/me }
            X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
              examples:
                firstVisit: { $ref: "#/components/examples/ProfileFirstVisit" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /healthz:
    get:
      tags: [Operations]
      operationId: liveness
      summary: Liveness probe; checks no dependencies
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: UP }

  /readyz:
    get:
      tags: [Operations]
      operationId: readiness
      summary: Readiness probe; fails while Postgres is unreachable
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: UP }
        "503":
          description: Not ready (database unreachable). No details are disclosed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: DOWN }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Auth0 access token (RS256) for the HL Budget API audience. Validated for signature,
        issuer, audience and expiry on every request.

  headers:
    X-Request-Id:
      description: Trace reference for this request; equals `traceId` in any problem body
      schema: { type: string, example: 4be0baf6ee174255 }

  schemas:
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, email, avatarUrl, firstSeenAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque HL Budget identifier for the user. Not the Auth0 subject
          example: 0b9f6c1e-3c1a-4f2e-9a57-2f1d6c2b8e11
        displayName:
          type: [string, "null"]
          maxLength: 255
          description: Name from the identity provider; null when it has none
          example: Alex Example
        email:
          type: [string, "null"]
          format: email
          maxLength: 320
          description: Email from the identity provider; null when it has none
          example: alex@example.com
        avatarUrl:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: HTTPS address of the avatar image; null when there is none
          example: https://lh3.googleusercontent.com/a/example
        firstSeenAt:
          type: string
          format: date-time
          description: When the record was created (UTC)
          example: "2026-10-25T09:15:00Z"
        lastSeenAt:
          type: string
          format: date-time
          description: When the user last called this operation (UTC)
          example: "2026-10-26T18:02:41Z"

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]

    Problem:
      type: object
      description: RFC 9457 problem details, as produced by the backend's single error handler
      required: [type, title, status, instance, timestamp, traceId]
      properties:
        type:
          type: string
          description: Stable URN naming the error category
          enum:
            - urn:problem:hl-budget:unauthenticated
            - urn:problem:hl-budget:access-denied
            - urn:problem:hl-budget:bad-request
            - urn:problem:hl-budget:not-found
            - urn:problem:hl-budget:conflict
            - urn:problem:hl-budget:unprocessable-entity
            - urn:problem:hl-budget:internal-error
            - urn:problem:hl-budget:service-unavailable
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail:
          type: string
          description: Human-readable explanation. For 5xx always a fixed, safe sentence
        instance: { type: string, description: Request path }
        timestamp: { type: string, format: date-time }
        traceId: { type: string }
        details:
          type: object
          description: Structured, scalar-only context; `reason` when a client must branch
          additionalProperties: true
        errors:
          type: array
          description: One entry per offending field (validation failures only)
          items: { $ref: "#/components/schemas/FieldViolation" }

    FieldViolation:
      type: object
      required: [pointer, field, code, message]
      properties:
        pointer: { type: string, example: "#/name" }
        field: { type: string, example: name }
        code: { type: string, example: NotBlank }
        message: { type: string, example: must not be blank }

  responses:
    Unauthenticated:
      description: |
        Missing, malformed, expired, wrongly signed, wrong-issuer or wrong-audience token.
        No user data is returned or created.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:unauthenticated
            title: Unauthorized
            status: 401
            detail: A valid bearer token is required
            instance: /api/v1/users/me
            timestamp: "2026-10-25T09:15:00Z"
            traceId: 4be0baf6ee174255
    InternalError:
      description: Unexpected failure. Cause is logged against traceId and never returned
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:internal-error
            title: Internal Server Error
            status: 500
            detail: An unexpected error occurred
            instance: /api/v1/users/me
            timestamp: "2026-10-25T09:15:00Z"
            traceId: 4be0baf6ee174255
    ServiceUnavailable:
      description: A required dependency (the database) is unreachable
      headers:
        X-Request-Id: { $ref: "#/components/headers/X-Request-Id" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: urn:problem:hl-budget:service-unavailable
            title: Service Unavailable
            status: 503
            detail: The service is temporarily unavailable
            instance: /api/v1/users/me
            timestamp: "2026-10-25T09:15:00Z"
            traceId: 4be0baf6ee174255

  examples:
    ProfileFirstVisit:
      summary: First call creates the record
      value:
        id: 0b9f6c1e-3c1a-4f2e-9a57-2f1d6c2b8e11
        displayName: Alex Example
        email: alex@example.com
        avatarUrl: https://lh3.googleusercontent.com/a/example
        firstSeenAt: "2026-10-25T09:15:00Z"
        lastSeenAt: "2026-10-25T09:15:00Z"
    ProfileReturning:
      summary: Later call refreshes lastSeenAt; no avatar at the identity provider
      value:
        id: 0b9f6c1e-3c1a-4f2e-9a57-2f1d6c2b8e11
        displayName: Alex Example
        email: alex@example.com
        avatarUrl: null
        firstSeenAt: "2026-10-25T09:15:00Z"
        lastSeenAt: "2026-10-26T18:02:41Z"
